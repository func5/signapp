spring.application.name=signapp

# server config
server.port=80
server.servlet.context-path=/

# view config
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# db config
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=
spring.datasource.username=root
spring.datasource.password=java1234

# JPA 설정 (JPA 사용 시)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# multipart config
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# log config
logging.level.com.example.signapp.controller=info
logging.level.com.example.signapp.service=info
logging.level.com.example.signapp.mapper=info
logging.level.com.example.signapp.filter=info
logging.level.com.example.signapp.rest=info